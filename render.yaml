services:
  - type: web
    name: happysite
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm run install:all && npm run build:client
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.11.1
